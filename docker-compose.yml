
services:
  db:
    image: mongo:7.0.14
    ports:
      - "127.0.0.1:27017:27017"

  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/config:/app/config
      - ./backend/src:/app/src
      - ./backend/manage.py:/app/manage.py
    depends_on:
      - db
    env_file:
      - .env
    environment:
      TICKET_EMAIL_ENABLED: ${TICKET_EMAIL_ENABLED:-false}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-tickets@example.com}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.sendgrid.net}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-apikey}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
    depends_on:
      - backend
    env_file:
      - .env
